<!doctype html>
<!-- Field Twin Violet v1 -->
<!-- RED PHONE: phone app page for field-twin-violet-api. Built by Claude Code in the cloud session for Red Phone. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3e7da">
<title>Field Twin Violet</title>
<link rel="manifest" href="/field-twin-violet.webmanifest">
<link rel="icon" href="/field-twin-violet-icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f6efe6; --card: #fffaf3; --line: #e3d5c4; --text: #3b2a20; --muted: #7d6656;
    --accent: #b83a2b; --accent2: #d9772f; --ok: #3f7d4e; --warn: #fff0c2; --warnline: #e3b54a;
    --chip: #efe2d2; --bad: #fbe0dc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: 76px; }
  header { position: sticky; top: 0; z-index: 5; background: #f3e7da; border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; color: var(--accent); }
  .pill { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .pill.off { background: var(--bad); color: var(--accent); }
  .pill.demo { background: var(--warn); color: #7a5600; }
  main { padding: 12px 16px; max-width: 760px; margin: 0 auto; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #f3e7da; border-top: 1px solid var(--line); z-index: 5; padding-bottom: env(safe-area-inset-bottom); }
  nav[hidden] { display: none; }
  nav button { flex: 1; border: 0; background: none; padding: 10px 2px 12px; font-size: 13px; color: var(--muted); }
  nav button.on { color: var(--accent); font-weight: 700; box-shadow: inset 0 3px 0 var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 10px 0; }
  h2 { font-size: 17px; margin: 18px 0 6px; }
  h3 { font-size: 15px; margin: 12px 0 4px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 3px; }
  input, select, textarea { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); }
  textarea { min-height: 60px; }
  input.low, select.low { background: var(--warn); border-color: var(--warnline); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .btn { font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--text); border-radius: 9px; padding: 10px 14px; }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .wide { width: 100%; margin-top: 10px; }
  .small { padding: 5px 9px; font-size: 13px; }
  button:disabled { opacity: .5; }
  .types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .types button { padding: 10px 4px; font-size: 14px; }
  .types button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .muted { color: var(--muted); font-size: 13px; }
  .err { color: var(--accent); font-size: 14px; margin: 6px 0; }
  .list > div { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list > div:last-child { border-bottom: 0; }
  .tap { cursor: pointer; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 7px; border-radius: 6px; background: var(--chip); margin-right: 4px; }
  .b-received { background: #dcefe0; } .b-moved { background: #e6e2f3; } .b-installed { background: #dbe9f4; }
  .b-pulled { background: #f8d6cf; } .b-returned { background: #f3e6c8; } .b-written_off { background: #e8dcd2; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .tile.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .tile b { display: block; font-size: 22px; }
  .bar { height: 8px; background: var(--accent2); border-radius: 4px; margin-top: 3px; }
  .conf { font-size: 11px; color: var(--muted); }
  .conf.low { color: #8a5a00; font-weight: 700; }
  .thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); }
  .photos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .preview { max-width: 100%; max-height: 260px; border-radius: 10px; display: block; margin: 8px 0; }
  .conflict { background: var(--bad); border-color: #e9b3aa; }
  #modal { position: fixed; inset: 0; background: rgba(120, 95, 75, .35); display: none; z-index: 10; overflow: auto; padding: 24px 12px; }
  #modal.open { display: block; }
  #modal .sheet { background: var(--bg); border-radius: 14px; max-width: 700px; margin: 0 auto; padding: 14px 16px; }
  #modal img.full { width: 100%; border-radius: 10px; margin-top: 8px; }
  #toast { position: fixed; left: 16px; right: 16px; bottom: 86px; background: #fff3dc; border: 1px solid var(--warnline); color: var(--text); padding: 10px 12px; border-radius: 10px; display: none; z-index: 20; text-align: center; }
  .login { max-width: 420px; margin: 40px auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); margin: 0; }
  .check input { width: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 4px 0; vertical-align: top; }
  td:last-child { text-align: right; }
</style>
</head>
<body>
<header><h1>Field Twin Violet</h1><span id="status"></span></header>
<main id="app"><p class="muted">Loading</p></main>
<nav id="nav" hidden>
  <button data-tab="stock">Stock</button>
  <button data-tab="log">Log</button>
  <button data-tab="history">History</button>
  <button data-tab="failures">Failures</button>
  <button data-tab="more">More</button>
</nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script src="/vendor/supabase.js"></script>
<script src="/vendor/zxing.min.js"></script>
<script src="/field-twin-violet-v1.js"></script>
</body>
</html>
